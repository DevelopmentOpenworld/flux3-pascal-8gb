<!doctype html><html lang="__LANG__"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>__REPORT_TITLE__</title>
<style>
:root{--bg:#f3f1ec;--paper:#fffefa;--ink:#222d32;--muted:#5a696e;--line:#ccd2ce;--accent:#235d67;--red:#9b3340;--amber:#795820;--green:#28664c}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);background:var(--bg);font:16px/1.55 "Segoe UI",Arial,sans-serif}main{max-width:1460px;margin:auto;padding:28px clamp(18px,4vw,60px) 64px}header{border-bottom:2px solid var(--ink);padding:18px 0 28px}.eyebrow{font-size:12px;letter-spacing:2px;color:var(--accent);font-weight:700}h1{font-size:clamp(34px,4.3vw,64px);letter-spacing:-1.8px;line-height:1.1;margin:14px 0 20px;max-width:1050px}h2{font-size:29px;line-height:1.2;letter-spacing:-.6px;margin:0 0 18px}h3{font-size:19px;line-height:1.35;margin:0 0 12px}p{margin:0 0 14px}.lead{font-size:20px;max-width:1000px}.muted,small{color:var(--muted)}nav{display:flex;gap:8px;flex-wrap:wrap;padding:20px 0;position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}button,select,input{font:inherit}button,select{border:1px solid var(--line);border-radius:5px;background:var(--paper);color:var(--ink);padding:9px 13px;cursor:pointer}button[aria-pressed=true],nav button[aria-selected=true]{background:var(--accent);border-color:var(--accent);color:white}button:focus-visible,select:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #d39129;outline-offset:3px}a{color:var(--accent)}section[hidden]{display:none}section{padding:32px 0}section>p{max-width:1050px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin:26px 0}.stat{border-top:3px solid var(--accent);padding:13px 0}.stat strong{font-size:36px;display:block;font-variant-numeric:tabular-nums;letter-spacing:-1px}.stat span{color:var(--muted);font-size:14px}.note{background:#e7eeea;border-left:4px solid var(--accent);padding:18px 22px;margin:22px 0}.warning{background:#f5e9dd;border-left-color:var(--amber)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:23px}.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}.card{background:var(--paper);border:1px solid var(--line);border-radius:7px;overflow:hidden;min-width:0}.card img{width:100%;height:auto;max-height:620px;object-fit:contain;display:block;background:#e6e6e1}.body{padding:17px}.meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;margin:0 0 10px}.body p{font-size:14px}.body details{margin-top:14px}.body pre{max-height:350px;overflow:auto;font-size:12px}summary{cursor:pointer;color:var(--accent)}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#e9ece7;padding:16px;font:13px/1.6 Consolas,monospace;border-radius:5px}code{font-family:Consolas,monospace}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:24px 0}.toolbar label{display:flex;gap:10px;align-items:center}.filters{display:flex;gap:8px;flex-wrap:wrap}.badge{display:inline-block;border:1px solid currentColor;padding:2px 7px;border-radius:4px;font-size:11px;font-weight:650;margin:2px 4px 5px 0}.PASS{color:var(--green)}.FAIL{color:var(--red)}.UNCERTAIN{color:var(--amber)}.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px;margin:20px 0}th,td{border-bottom:1px solid var(--line);text-align:left;vertical-align:top;padding:10px 12px}th{background:#e5e9e3}td.num{font-variant-numeric:tabular-nums;white-space:nowrap}.empty{padding:40px;background:var(--paper);border:1px dashed var(--line)}.gui-shot{max-width:390px;width:100%;border:1px solid var(--line);margin:15px 0}.twocol{display:grid;grid-template-columns:1.2fr .8fr;gap:32px}footer{border-top:2px solid var(--ink);padding-top:18px;font-size:13px;color:var(--muted)}.sources li{margin:12px 0}.bar{display:flex;gap:15px;align-items:center;margin:10px 0}.bar label{width:105px;font-size:13px}.bar span{background:var(--accent);height:18px;min-width:2px}.bar b{font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{grid-template-columns:repeat(2,1fr)}.twocol{grid-template-columns:1fr}}@media(max-width:650px){.grid,.pair{grid-template-columns:1fr}nav{position:static}nav button{flex:1 1 40%}.toolbar label{align-items:start;flex-direction:column}h2{font-size:25px}.stat strong{font-size:29px}}
.language-switch{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin:0 0 12px}.language-switch span{font-size:14px;color:var(--muted)}
</style></head><body><main><div class="language-switch" role="group" aria-label="Язык / Language"><span>Язык / Language</span><button type="button" data-language="ru" lang="ru">Русский</button><button type="button" data-language="en" lang="en">English</button></div><div id="report-shell">__REPORT_SHELL__</div>
<script id="report-data" type="application/json">__REPORT_DATA__</script>
<script>__REPORT_SCRIPT__</script></main></body></html>
